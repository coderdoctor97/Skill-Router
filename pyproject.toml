[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-router"
version = "2.0.0"
description = "Deterministic skill discovery and routing for AI coding agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Satya", email = "coderdoctor97@users.noreply.github.com"}]
keywords = ["ai", "agent", "skill", "routing", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []  # stdlib only

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
skill-router = "skill_router:main"

[project.urls]
Homepage = "https://github.com/coderdoctor97/Skill-Router"
Repository = "https://github.com/coderdoctor97/Skill-Router"
Issues = "https://github.com/coderdoctor97/Skill-Router/issues"

[tool.setuptools]
py-modules = ["skill"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Test"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["skill.py"]
branch = true
